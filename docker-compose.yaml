version: '3.8'

services:
  redis:
    image: "redis/redis-stack:latest"
    container_name: "redis"
    ports:
      - 6379:6379
      - 8001:8001
    networks:
      - vc-network

  wsserver:
    build: ./vc-ws
    container_name: "wsserver"
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - vc-network

  core_server:
    build: ./vc-core
    container_name: core_server
    restart: always
    env_file:
      - ./vc-core/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - 5000:5000
    networks:
      - vc-network

networks:
  vc-network:
    driver: bridge
