version: '3.8'

services:
  redis:
    image: "redis/redis-stack:latest"
    container_name: "redis"
    ports:
      - 6379:6379
      - 8001:8001
    networks:
      - vc-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server --requirepass ${REDIS_PASSWORD}

  vc_ws:
    build:
      context: .
      dockerfile: ./vc-ws/Dockerfile
    container_name: "vc_ws"
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - vc-network

  vc_core:
    build: 
      context: .
      dockerfile: ./vc-core/Dockerfile
    container_name: vc_core
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD} 
    ports:
      - 5000:5000
    networks:
      - vc-network
    depends_on:
      - db
      - redis
  db:
    image: mongo
    container_name: vc_db
    restart: always
    ports:
      - 27017:27017
    networks:
      - vc-network
    
    environment:
      DB_ROOT_USERNAME: ${DB_ROOT_USERNAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./mongo-data:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    env_file:
      - .env
  nginx:
    image: nginx:latest
    networks:
      - vc-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - vc_ws
      - vc_core
networks:
  vc-network:
    name: vc-server_vc-network
    driver: bridge
